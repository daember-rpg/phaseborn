name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches module.json version
        run: |
          VERSION=$(jq -r .version module.json)
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module.json version v$VERSION"
            exit 1
          fi

      - name: Build module zip
        run: |
          zip -r phaseborn.zip module.json README.md CHANGELOG.md LICENSE.md lang scripts styles templates

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" phaseborn.zip module.json \
            --title "Phaseborn ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for details."
