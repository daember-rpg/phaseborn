name: Release

# Publishes a GitHub release whenever the version in module.json has no
# release yet. Bump "version" in module.json and push to main to ship an update.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "tag=v$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module zip
        if: steps.exists.outputs.found == 'false'
        run: |
          zip -r phaseborn.zip module.json README.md CHANGELOG.md LICENSE.md lang scripts styles templates

      - name: Create GitHub release
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" phaseborn.zip module.json \
            --target "${GITHUB_SHA}" \
            --title "Phaseborn ${{ steps.ver.outputs.tag }}" \
            --notes "See CHANGELOG.md for details."
